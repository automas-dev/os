name: CI Tests

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - reopened
      - synchronize

env:
  BUILD_DIR: "${{ github.workspace }}/build"
  TEST_DIR: "${{ github.workspace }}/tests"

jobs:
  # test:
  #   runs-on: ubuntu-latest

  #   steps:
  #     - uses: actions/checkout@v6

  #     - name: Install dependencies
  #       run: sudo apt-get install -y build-essential gcc-multilib g++-multilib

  #     - name: Install gcovr
  #       run: pip install gcovr

  #     - name: Setup project
  #       run: cmake -S ${TEST_DIR} -B ${BUILD_DIR} -DCMAKE_BUILD_TYPE=Debug

  #     - name: Build
  #       run: cmake --build ${BUILD_DIR}

  #     # TODO reenable testing once arch. is stable again
  #     # - name: Test
  #     #   working-directory: build
  #     #   run: ctest -V

  #     # TODO re-enable this once coverage is complete
  #     # - name: Test with Coverage
  #     #   working-directory: build
  #     #   run: cmake --build ${BUILD_DIR} --target os_test_coverage

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Lint src
        uses: jidicula/clang-format-action@v4.14.0
        with:
          clang-format-version: "18"
          check-path: src

      - name: Lint tests
        uses: jidicula/clang-format-action@v4.14.0
        with:
          clang-format-version: "18"
          check-path: tests/src

  increment_version:
    name: Increment Version
    uses: automas-dev/reusable-workflows/.github/workflows/increment_version.yml@v1.1
    secrets: inherit
    with:
      dry-run: ${{ github.ref != 'refs/heads/main' }}

    needs:
      # - test
      - lint

    permissions:
      contents: write

  check:
    runs-on: ubuntu-latest
    if: always()

    needs:
      # - test
      - lint
      - increment_version

    timeout-minutes: 1

    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
